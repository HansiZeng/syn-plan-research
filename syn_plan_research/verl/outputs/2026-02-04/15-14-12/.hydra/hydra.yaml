    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /work/hzeng_umass_edu/ir-research/SynPlanResearch/scripts/web_research/latest_verl
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /work/hzeng_umass_edu/ir-research/SynPlanResearch/scripts/web_research/latest_verl/verl/trainer/config
      schema: file
      provider: main
    - path: ''
