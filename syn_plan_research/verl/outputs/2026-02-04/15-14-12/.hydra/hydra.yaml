    chdir: null
    override_dirname: actor_rollout_ref.actor.fsdp_config.optimizer_offload=False,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.ulysses_sequence_parallel_size=2,actor_rollout_ref.eval_output_path=/gypsum/work1/zamani/hzeng/syn-plan-research/eval_outputs/syn_plan_research_4b_pass_at_1_all/eval.parquet,actor_rollout_ref.model.path=hzeng/syn-plan-research-4B,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.ref.fsdp_config.param_offload=True,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=8,actor_rollout_ref.rollout.gpu_memory_utilization=0.9,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=8,actor_rollout_ref.rollout.max_assistant_turns=16,actor_rollout_ref.rollout.max_model_len=20000,actor_rollout_ref.rollout.mode=async,actor_rollout_ref.rollout.multi_turn.completion_callback=tests.workers.rollout.my_test_web_research_completion_callback.Qwen3CustomToolCompletionCallback,actor_rollout_ref.rollout.n=1,actor_rollout_ref.rollout.prompt_length=32768,actor_rollout_ref.rollout.response_length=8192,actor_rollout_ref.rollout.tensor_model_parallel_size=1,actor_rollout_ref.rollout.val_kwargs.do_sample=True,actor_rollout_ref.rollout.val_kwargs.temperature=0.6,actor_rollout_ref.rollout.val_kwargs.top_k=20,actor_rollout_ref.rollout.val_kwargs.top_p=0.95,data.custom_cls.name=WebResearchRLDataset,data.custom_cls.path=pkg://verl/utils/dataset/web_research_dataset,data.max_prompt_length=16384,data.max_response_length=4096,data.truncation=error,data.val_files=hzeng/syn-plan-research-data-eval,tool_server.web_search_server.api_key=307dc01dc3e9ed75963943ed5104adbe5e93abf7,tool_server.web_search_server.cache_file=/gypsum/work1/zamani/hzeng/syn-plan-research/cache/serper_search_cache.jsonl,trainer.n_gpus_per_node=2,trainer.nnodes=1,trainer.total_epochs=1,validation.pass_at_k=1
    id: ???
