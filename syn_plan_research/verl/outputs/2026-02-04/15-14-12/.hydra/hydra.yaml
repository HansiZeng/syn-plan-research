    - actor_rollout_ref.actor.ulysses_sequence_parallel_size=2
    - actor_rollout_ref.actor.fsdp_config.param_offload=False
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=False
    - actor_rollout_ref.rollout.max_model_len=20000
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=8
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.9
    - actor_rollout_ref.rollout.n=1
    - actor_rollout_ref.eval_output_path=/gypsum/work1/zamani/hzeng/syn-plan-research/eval_outputs/syn_plan_research_4b_pass_at_1_all/eval.parquet
    - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=8
    - actor_rollout_ref.ref.fsdp_config.param_offload=True
    - actor_rollout_ref.rollout.max_assistant_turns=16
